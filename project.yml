name: DoniApp

options:
  bundleIdPrefix: com.doni
  deploymentTarget:
    iOS: "17.0"

targets:
  DoniApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doni.doniapp
        PRODUCT_NAME: DoniApp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
